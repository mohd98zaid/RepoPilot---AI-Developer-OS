[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "Local-first AI developer environment for repository intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pathspec>=0.12,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "tree-sitter>=0.25,<1",
    "tree-sitter-javascript>=0.25,<1",
    "tree-sitter-python>=0.25,<1",
    "tree-sitter-typescript>=0.23,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "playwright>=1.50,<2",
]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
markers = ["browser: full Chromium end-to-end tests (requires built web UI and playwright chromium)", "docker: live Docker engine and prepared image required"]

[tool.ruff]
line-length = 100
target-version = "py311"
