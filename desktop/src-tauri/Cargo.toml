[package]
name = "repopilot-desktop"
version = "0.1.0"
description = "RepoPilot desktop shell"
authors = ["RepoPilot contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "repopilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
