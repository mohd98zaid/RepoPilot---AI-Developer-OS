name: RepoPilot checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock -e ".[dev]"
      - run: python -m ruff check apps tests scripts
      - run: docker build -f sandbox/Dockerfile.python -t repopilot-python-tests .
      - run: python -m pytest -q -m "not browser"
      - run: python scripts/run_evaluation.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install -r requirements.lock -e ".[dev]"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m playwright install chromium
      - run: python -m pytest -q -m browser
